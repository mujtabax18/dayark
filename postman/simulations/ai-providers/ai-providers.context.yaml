purpose:
  stands_in_for: OpenAI, Gemini, Anthropic, Ollama and compatible chat/model endpoints.
  unblocks: Local verification of the actual DayArk Dio adapters without vendor keys or paid generation.
assumptions:
  - id: text-generation-and-discovery-contracts
    status: supported
    claim: The adapters serialize text chat and model discovery using the documented endpoint and response shapes represented by these fixtures.
    reason: Published vendor contracts support the shapes; local simulation observed actual adapter HTTP calls and normalized replies. This does not establish live credentials, quota, model access or all capabilities.
    verification: On 2026-11-16, ran tool/ai/verify_provider_simulation.dart against Postman CLI 1.74.0 on loopback port 4017. All five providers passed connection checks, discovery, generation, Unicode replies and usage normalization while the same conversation history continued through each provider. Simulation request events showed GET discovery and POST generation for every member. No live vendor requests were sent. Initially found and corrected fixture body re-parsing and numeric query parameter serialization.
    source: lib/ai/README.md contract references; tool/ai/verify_provider_simulation.dart; postman/mocks/*/default.js; test/ai/ai_http_provider_test.dart
    updated_at: '2026-11-16'
  - id: remote-model-discovery-implies-generation-access
    status: unknown
    claim: A model returned by a provider catalog is available for paid generation with the same credentials and all declared settings.
    reason: Catalog reachability and membership do not establish inference entitlement, quota, or every model-specific capability. The fixtures use synthetic model IDs. Explicit capability overrides and live account verification remain necessary.
    verification: No vendor credentials used. Connection checks intentionally only list model metadata and do not incur generation. Local tests verify optional selected-model membership across paginated catalogs.
    source: lib/ai/providers/http/http_ai_provider.dart; test/ai/ai_http_provider_test.dart
    updated_at: '2026-11-16'
  - id: provider-owner-mock-reuse
    status: unknown
    claim: These synthetic fixtures match a provider-maintained published mock.
    reason: Published-owner mock search was skipped because the CLI has no signed-in session. Fixtures were derived from official documentation and supplemented by Orbit, rather than copied from a maintained mock.
    verification: postman whoami reported no account details; postman status is not a supported command in this CLI build. No workspace was initialized or published.
    source: lib/ai/README.md; postman/mocks/*/config.yaml
    updated_at: '2026-11-16'
  - id: part4-settings-model-picker
    status: supported
    claim: The settings UI can discover selectable model IDs, test the selected model connection, and persist the selection for all five remote provider kinds against these local fixtures.
    reason: The actual Flutter settings screen and Dio adapters ran against the existing loopback simulation. This supports the local integration path, not live account entitlement or new model inference compatibility.
    verification: On 2026-11-16, ran flutter test --no-pub --dart-define=DAYARK_AI_SIMULATION=true test/ai/ai_settings_simulation_test.dart with Postman CLI 1.74.0 on port 4017. The test passed for OpenAI, Gemini, Anthropic, Ollama and compatible profiles. Request events showed successful GET model discovery and selected-model connection checks for each member. Also reran tool/ai/verify_provider_simulation.dart; all five adapters passed generation and continued-history checks, with GET/POST request events observed. Fixtures remain synthetic and unchanged; no vendor requests or credentials were used.
    source: test/ai/ai_settings_simulation_test.dart; lib/ai/settings/ai_settings_screen.dart; tool/ai/verify_provider_simulation.dart; postman/mocks/*/default.js
    updated_at: '2026-11-16'
  - id: part5-streaming-text-contracts
    status: supported
    claim: The five DayArk HTTP adapters normalize incremental SSE or NDJSON text, terminal responses and available token usage in the local text-only scenarios exercised.
    reason: Existing contract-derived mocks were extended with streaming responses. Real Dart adapters passed streaming and non-streaming checks, while independent loopback tests covered fragmented UTF-8/event framing, incomplete streams, safe errors and consent. This does not establish live model access, native inference or every vendor event variant.
    verification: On 2026-11-17, ran Postman CLI 1.74.0 on loopback port 4018 and tool/ai/verify_provider_simulation.dart http://127.0.0.1:4018/. All five adapters passed connection, discovery, generation, two or more streamed deltas, final Unicode text and token usage, with continued history. Request events showed GET model checks and successful POST generation/streaming for every member, including Gemini streamGenerateContent. The Flutter suite also exercised stream interruption, inactivity timeout, cancellation and inline attachment serialization against real loopback HTTP. No vendor keys or paid requests were used.
    source: tool/ai/verify_provider_simulation.dart; test/ai/ai_streaming_test.dart; lib/ai/providers/http/ai_http_transport.dart; lib/ai/providers/http/http_ai_provider.dart; postman/mocks/*/default.js; docs/AI_PART5.md
    updated_at: '2026-11-17'
  - id: ollama-cold-start-and-thinking
    status: supported
    claim: DayArk can request ordinary Qwen 3.5 2B chat with thinking disabled, allow local model startup, and treat thinking-only frames as activity.
    reason: The installed local model reports thinking enabled by default. A raw synthetic request exhausted a 128-token budget in thinking with no answer; the fixed actual Dart gateway and adapter produced a complete greeting with think false. Independent timed and HTTP regression tests establish startup/idle separation, activity propagation and explicit thinking control.
    verification: On 2026-11-17, local Ollama api/show reported qwen3.5:2b thinking values false and true with default true. A synthetic default-thinking request emitted its first frame after 5.94 seconds and ended after 12.1 seconds with 128 tokens, thinking characters and empty answer. tool/ai/verify_ollama.dart qwen3.5:2b then returned a full greeting after 16.864 seconds through the updated adapter with think false. Local fixtures also exercised both thinking boolean values and hidden activity frames; the five-provider simulation was rerun for compatibility. No saved user conversations, vendor credentials or downloads were involved. Timings depend on model loading and hardware.
    source: tool/ai/verify_ollama.dart; test/ai/ai_streaming_test.dart; test/ai/ai_settings_test.dart; lib/ai/core/ai_gateway.dart; lib/ai/providers/http/http_ai_provider.dart; https://docs.ollama.com/capabilities/thinking
    updated_at: '2026-11-17'
  - id: ollama-chat-thinking-and-unbounded-wait
    status: supported
    claim: Configured Ollama chat omits the shared output cap, requests num_predict -1, exposes available thinking as activity, and local stream waits remain cancellable without startup or inactivity timers.
    reason: Actual Dio adapter calls against synthetic loopback HTTP verify serialization and thinking/answer delivery, including both in one frame. Timed gateway fixtures verify waiting beyond configured limits and Stop. These results establish caller behavior, not that every installed model will terminate or produce an answer.
    verification: On 2026-11-17, 51 targeted Flutter tests passed across streaming, controller, chat UI, settings and HTTP provider suites. The configured-assistant test saved a 2048-token cap and observed num_predict -1 on the actual HTTP request while preserving saved preferences. Widget tests expanded live thinking, checked the local performance tooltip, then observed the completed answer. Provider-limit fixtures verify a specific explanation when generation ends with length and no answer. Existing Postman mocks were not changed or rerun in this session; loopback HTTP fixtures provided the necessary thinking and length frames. No live inference was performed. Prior cold-start evidence above remains historical; reasoning is now accessible in the live thinking panel.
    source: test/ai/ai_streaming_test.dart; test/ai/ai_chat_controller_test.dart; test/ai/ai_chat_screen_test.dart; lib/ai/settings/ai_configured_assistant.dart; lib/ai/providers/http/ai_http_transport.dart; https://github.com/ollama/ollama/blob/main/docs/modelfile.mdx
    updated_at: '2026-11-17'
  - id: configured-output-budgets-restored
    status: supported
    claim: Configured DayArk chat preserves saved offline and Ollama output budgets, and temporary Ollama overrides reach num_predict as positive limits.
    reason: The 2026-11-17 unbounded-chat behavior above was deliberately superseded by the workspace performance requirements. Actual loopback adapter tests assert configured limits and overrides; the existing five-provider simulation still exercises successful streaming and continued history. This does not establish that every external provider honors its requested limit.
    verification: On 2026-11-20, real Dart adapters passed connection, discovery, generation, streaming and continued-history checks against Postman CLI 1.74.0 on loopback port 4017. Request events were observed for every member. Flutter HTTP tests assert num_predict 32, configured 2048 and temporary 128; native context tests assert preserved budgets and output reservation. Existing synthetic contract-derived mocks were reused without publication or vendor requests. No model-speed improvement was inferred from these tests.
    source: tool/ai/verify_provider_simulation.dart; test/ai/ai_streaming_test.dart; test/ai/ai_http_provider_test.dart; test/ai/ai_local_context_regression_test.dart; docs/AI_WORKSPACE.md
    updated_at: '2026-11-20'
